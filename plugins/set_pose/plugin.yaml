name: set_pose
version: "1.0.0"
description: Sets the character's current pose (catalog key + display detail)

skills:
  - skill_id: set_pose
    always_load: true
    default_enabled: true
    singleton: true        # replaces the class attribute (F7)
  - skill_id: prop_action
    module: skill_prop_action.py
    always_load: true
    default_enabled: true
    singleton: true

templates:
  llm: templates/llm

config_schema:
  set_pose:
    label: SetActivity
    fields:
      enabled: {type: bool, label: Enabled, default: true}
  prop_action:
    label: PropAction
    fields:
      enabled: {type: bool, label: Enabled, default: true}
