name: send_message
version: "1.0.0"
description: SendMessage verb — remote text message to a character not present (optional image attachment from the same turn)

skills:
  - skill_id: send_message
    always_load: true
    default_enabled: true
    remote_comm: true             # reaches characters NOT present (world-setup checklist)
    cascade_brake: true           # reply_only_to gate for messaging cascades
    delivers_speech: true         # spoken/written words reach someone through this verb
    intents: [send_message]       # [INTENT: send_message] follow-up (F6)
    intent_payload_keys: [content, message]

templates:
  llm: templates/llm

config_schema:
  send_message:
    label: SendMessage (remote)
    fields:
      enabled: {type: bool, label: Enabled, default: true}
      max_unanswered: {type: int, label: Max unanswered messages, default: 3, min: 0, max: 50, description: "Messages a character may send to the same recipient without a reply in between. Then it waits for an answer. 0 = no limit."}
      retry_after_game_hours: {type: int, label: Retry after (game hours), default: 24, min: 1, max: 720, description: "After this much GAME time without a reply, one more message may go out (a reminder); then the wait starts again."}
