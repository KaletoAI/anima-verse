name: transformation
version: "1.0.0"
category: skill
description: A leading character holding a power item turns into one of its linked characters (a body swap — the linked character stands exactly where the leader stood); knowers are kept as a secret of the mind.
capability_label: Transformation
capability_description: The character can turn into one of its linked characters through a power item it holds, and back.
on_load: register.py
skills:
  - skill_id: transform
    class: TransformationSkill
    params: {verb: transform}
    always_load: true
    default_enabled: false   # opt-in per leader (Skills tab); shows the Transformation tab
  - skill_id: revert
    class: TransformationSkill
    params: {verb: revert}
    always_load: true
    default_enabled: true
  - skill_id: reveal_identity
    class: TransformationSkill
    params: {verb: reveal_identity}
    always_load: true
    default_enabled: true
state_flags:
  - flag: is_transformed
    cleared_by: revert
    prompt_when_set: "You are transformed: this body is your other self. To be your ordinary self again — where nobody who is not in on the secret is watching — use {clear_tool}."
templates:
  llm: templates/llm
