name: interact
capability_label: "Pair interactions"
capability_description: "The character can do something TOGETHER with someone present — shake hands, dance — which plays a synchronised pair animation for both in 3D."
version: "1.0.0"
description: Pair-interaction verb — two present characters play a pair animation clip together at one anchor
enabled_default: true

# The core records an invitation and emits `interaction.invited`; this module
# turns that into a turn for an NPC invitee and supplies the `pair_verb_name`
# capability, so no core file has to name the verb (R1).
on_load: register.py

skills:
  - skill_id: interact
    class: InteractSkill
    always_load: true
    default_enabled: true
    cascade_brake: true

templates:
  llm: templates/llm

config_schema:
  interact:
    label: InteractWith (pair animations)
    fields:
      enabled: {type: bool, label: Enabled, default: true}
