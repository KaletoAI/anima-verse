name: searx
version: "1.1.0"
description: Web search via self-hosted SearX meta search engine
skills:
  - skill_id: searx
    search_intent: true   # search-forcing hint targets this tool
    progress_type: search # count-based intent/assignment progress
templates:
  llm: templates/llm
config_schema:                  # /admin/settings -> Skills -> SearX Web Search
  searx:
    label: SearX Web Search
    fields:
      enabled: {type: bool, label: Enabled, default: false}
      url: {type: str, label: "SearX URL", default: "http://localhost:8888", description: "Base URL of the SearX instance (its /search endpoint is called)"}
      engines: {type: str, label: Engines, default: "google,duckduckgo,bing", description: "Comma-separated search engines"}
      categories: {type: str, label: Categories, default: "general"}
      num_results: {type: int, label: "Max results", default: 5, min: 1, max: 50}
