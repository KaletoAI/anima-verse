[tool.poetry]
name = "agent-system"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = "^3.11"
uvicorn = "^0.23.2"


[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "agent-system"
version = "0.1.0"
dependencies = [
    "openai>=1.0.0",
    "fastapi>=0.95.0",
    "starlette>=1.3.1",
    "uvicorn>=0.22.0",
    "jinja2>=3.1.2",
    "python-multipart",
    "bcrypt>=4.0.0",
    "apscheduler",
    "pyyaml",               # plugin manifests (app/plugins/loader.py imports yaml at boot)
    "onnxruntime",          # runtime for rembg's u2net + fastembed (rembg declares it only as an extra)
    "fastembed>=0.9.1",     # permits Pillow 13; built-in ONNX/CPU embeddings
    "aiohttp>=3.14.4",      # patched request parsing, resource limits and cookies
    "gradio_client",        # TTS backends (F5/XTTS via Gradio)
    "rembg>=2.0.86",        # permits Pillow 13; background removal (u2net)
    # Pillow decodes uploads, imported assets and backend image results.
    # Coordinate this security floor with fastembed/rembg's Pillow constraints.
    "pillow>=13.0.0",
    "anthropic>=0.40.0",
    # Patched minimums for transitive HTTP, trust-store and model-cache dependencies.
    "idna>=3.15",
    "urllib3>=2.7.0",
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "multidict>=6.9.1"
]
